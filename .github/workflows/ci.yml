name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke tests (no network, no API key needed)
        run: npm test

      - name: Check the generated tool reference is up to date
        run: |
          npm run gen:docs
          git diff --exit-code docs/TOOLS.md || {
            echo "::error::docs/TOOLS.md is stale. Run 'npm run build && npm run gen:docs' and commit the result."
            exit 1
          }
